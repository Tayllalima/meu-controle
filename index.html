<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#111827">
  <title>Meu Controle V3</title>
  <link rel="manifest" href="./manifest.json">
  <link rel="stylesheet" href="./style.css">
  <link rel="icon" href="./icon-192.svg" type="image/svg+xml">
</head>
<body>
  <header class="topbar">
    <div>
      <h1>Meu Controle V3</h1>
      <div id="syncStatus" class="sync">Offline</div>
    </div>
    <button id="logout" class="btn alt hidden">Sair</button>
  </header>

  <main>
    <section id="auth" class="auth-card">
      <h2>Entrar</h2>
      <p>Acesse sua conta para sincronizar seus dados.</p>

      <label for="email">E-mail</label>
      <input id="email" class="field" type="email" autocomplete="email">

      <label for="password">Senha</label>
      <input id="password" class="field" type="password" autocomplete="current-password">

      <div class="actions">
        <button id="signupBtn" class="btn alt">Criar conta</button>
        <button id="loginBtn" class="btn">Entrar</button>
      </div>

      <div id="authmsg" class="message hidden"></div>
    </section>

    <section id="app" class="hidden">
      <div class="toolbar">
        <input id="month" class="field month-field" type="month">
        <div class="toolbar-actions">
          <button class="btn" onclick="incomeModal()">+ Entrada</button>
          <button class="btn danger" onclick="expenseModal()">+ Gasto</button>
          <button class="btn alt" onclick="budgetModal()">Orçamento</button>
          <button class="btn alt" onclick="categoryModal()">Categoria</button>
        </div>
      </div>

      <section id="dashboard" class="screen active">
        <div id="summary" class="summary-grid"></div>

        <div class="grid-2">
          <div class="card">
            <h3>Orçamento por categoria</h3>
            <div id="budgets"></div>
          </div>

          <div class="card">
            <h3>Lançamentos recentes</h3>
            <div id="recent"></div>
          </div>
        </div>
      </section>

      <section id="transactions" class="screen">
        <div class="card">
          <div class="filters">
            <select id="fcat" class="field">
              <option value="">Todas as categorias</option>
            </select>

            <select id="ftype" class="field">
              <option value="">Todos os tipos</option>
              <option value="income">Entradas</option>
              <option value="expense">Gastos</option>
            </select>
          </div>

          <div id="all"></div>
        </div>
      </section>

      <section id="analysis" class="screen">
        <div class="grid-2">
          <div id="analysisBox" class="card"></div>
          <div class="card">
            <h3>Gastos por categoria</h3>
            <div id="catsBox"></div>
          </div>
        </div>
      </section>

      <section id="installmentsScreen" class="screen">
        <div id="installments"></div>
      </section>
    </section>
  </main>

  <nav id="nav" class="bottom-nav hidden">
    <button class="tab active" data-s="dashboard">Resumo</button>
    <button class="tab" data-s="transactions">Lançamentos</button>
    <button class="tab" data-s="analysis">Análise</button>
    <button class="tab" data-s="installmentsScreen">Parcelas</button>
  </nav>

  <div id="modal" class="modal">
    <div id="sheet" class="sheet"></div>
  </div>

  <script type="module" src="./app.js"></script>
</body>
</html>
